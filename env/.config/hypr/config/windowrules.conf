# Windows Rules https://wiki.hyprland.org/0.45.0/Configuring/Window-Rules/ #

# Float Necessary Windows
windowrule = float, class:^(org.pulseaudio.pavucontrol)
windowrule = float, class:^()$,title:^(Picture in picture)$
windowrule = float, class:^()$,title:^(Save File)$
windowrule = float, class:^()$,title:^(Open File)$
windowrule = float, class:^(LibreWolf)$,title:^(Picture-in-Picture)$
windowrule = float, class:^(blueman-manager)$
windowrule = float, class:^(xdg-desktop-portal-gtk|xdg-desktop-portal-kde|xdg-desktop-portal-hyprland)(.*)$
windowrule = float, class:^(polkit-gnome-authentication-agent-1|hyprpolkitagent|org.org.kde.polkit-kde-authentication-agent-1)(.*)$
windowrule = float, class:^(CachyOSHello)$
windowrule = float, class:^(zenity)$
windowrule = float, class:^(pomodorolm)$
windowrule = float, class:^()$,title:^(Steam - Self Updater)$
# Increase the opacity
windowrule = opacity 0.92, class:^(thunar|nemo)$
windowrule = opacity 0.96, class:^(goofcord|discord|armcord|webcord)$
windowrule = opacity 0.95, title:^(QQ|Telegram)$
windowrule = opacity 0.95, title:^(NetEase Cloud Music Gtk4)$
# General window rules
windowrule = float, title:^(Picture-in-Picture)$
windowrule = size 960 540, title:^(Picture-in-Picture)$
windowrule = move 25%-, title:^(Picture-in-Picture)$
windowrule = float, title:^(imv|mpv|danmufloat|termfloat|nemo|ncmpcpp)$
windowrule = move 25%-, title:^(imv|mpv|danmufloat|termfloat|nemo|ncmpcpp)$
windowrule = size 960 540, title:^(imv|mpv|danmufloat|termfloat|nemo|ncmpcpp)$
windowrule = pin, title:^(danmufloat)$
windowrule = rounding 5, title:^(danmufloat|termfloat)$
windowrule = rounding 0, title:^(waybar)$

windowrule = animation slide right, class:^(kitty|Alacritty)$
windowrule = noblur, class:^(org.mozilla.firefox)$
# Decorations related to floating windows on workspaces 1 to 10
windowrule = bordersize 2, floating:1, onworkspace:w[fv1-10]
windowrule = bordercolor $cachylblue, floating:1, onworkspace:w[fv1-10]
windowrule = rounding 8, floating:1, onworkspace:w[fv1-10]
# Decorations related to tiling windows on workspaces 1 to 10
windowrule = bordersize 3, floating:0, onworkspace:f[1-10]
windowrule = rounding 4, floating:0, onworkspace:f[1-10]


windowrule = workspace 2, class:(zen)
# Float Spotify and place it at your desired location
windowrule = workspace 11 silent, class:(Spotify)
windowrulev2 = float, class:^(Spotify)$
windowrulev2 = size 1051 602, class:^(Spotify)$
windowrulev2 = move -1065 1116, class:^(Spotify)$
windowrulev2 = workspace 11 silent, class:^(goofcord|discord)$
# Float Discord and place it at your desired location
windowrulev2 = float, class:^(goofcord|discord)$
windowrulev2 = size 1051 1276, class:^(goofcord|discord)$
windowrulev2 = move -1064 -177, class:^(goofcord|discord)$
windowrule = workspace 5, class:(org.qbittorrent.qBittorrent)
windowrule = workspace special:zotero, class:Zotero
windowrule = workspace 4, class:^(steam|heroic|lutris|modrinth-app)$
windowrule = workspace special:notion, class:notion-app-enhanced
windowrulev2 = float,class:Windscribe
windowrulev2 = float,class:file-jpeg
windowrulev2 = opacity 1.0 override,class:com.mitchellh.ghostty
windowrulev2 = workspace 10, class:^(steam_app_.*|cs2|gamescope|Minecraft.*)$
windowrulev2 = workspace 4, title:^(Rockstar Games)$
windowrulev2 = opacity 1.0 override 1.0 override, title:^(.*Netflix.*)$
windowrulev2 = opacity 1.0 override 1.0 override, title:^(.*YouTube.*)$
windowrulev2 = opacity 1.0 override 1.0 override, title:^(.*Twitch.*)$
windowrulev2 = opacity 1.0 override 1.0 override, title:^(.*Disney.*)$
windowrulev2 = opacity 1.0 override 1.0 override, title:^(.*Max.*)$
windowrulev2 = opacity 1.0 override 1.0 override, class:^(.*steam.*)$
windowrulev2 = opacity 1.0 override 1.0 override, class:^(.*Steam.*)$

windowrulev2 = noanim, class:^(steam_app_.*|cs2|gamescope|Minecraft.*)$

windowrulev2 = float, class:^(gamescope)$, title:^(.*Classic Offensive.*)
windowrulev2 = noanim, class:^(gamescope)$, title:^(.*Classic Offensive.*)
windowrulev2 = size 2560 1440, title:^(.*Classic Offensive.*)
windowrulev2 = center, class:^(gamescope)$, title:^(.*Classic Offensive.*)
windowrule = rounding 0, class:^(gamescope)$, title:^(.*Classic Offensive.*)
