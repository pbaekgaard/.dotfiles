# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃                     Monitor Configuration                   ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

# Monitor wiki https://wiki.hyprland.org/0.45.0/Configuring/Monitors/

# monitor = , preferred, auto, 1
monitor=DP-3,3440x1440@100,0x0,1
monitor=HDMI-A-1,1920x1080@60,-1080x-190,1.0,transform,3

# If you need to scale things like steam etc, please uncomment these lines.
# Adjust GDK_SCALE accordingly to your liking.
xwayland {
 force_zero_scaling = true       # Unscale XWayland
}

#env = GDK_SCALE, 1.25                   # GDK Scaling Factor

# Custom resolutions
exec-once = xrandr --newmode "1440x1440_100.00"  305.25  1440 1560 1720 2000  1440 1443 1453 1527 -hsync +vsync 
exec-once = xrandr --addmode DP-3 "1440x1440_100.00"
