# --- Special Workspaces ---
# These will be created automatically when a window spawns there
# workspace = special:music
workspace = special:notion
workspace = special:zotero
workspace = special:pomodoro

# --- Window Rules ---
# Spotify should open in the "music" special workspace
# windowrulev2 = workspace special:music, class:^(Spotify)$

# Zotero should open in the "zotero" special workspace
windowrulev2 = workspace special:zotero, class:^(Zotero)$

# Notion should open in the "notion" special workspace
windowrulev2 = workspace special:notion, class:^(notion-app-enhanced)$

# Solanum to Pomdoro workspace
windowrulev2 = workspace special:pomodoro, class:^(org.gnome.Solanum|pomotroid)$
windowrule = float,  class:^(org.gnome.Solanum)$
windowrule = center, class:^(org.gnome.Solanum|pomotroid)$


# Browsers on workspace 2
windowrulev2 = workspace 2, class:chromium
windowrulev2 = workspace 2, class:zen

windowrule = opacity 0.9 0.9, class:spotify


windowrule = tag +floating-window, class:(blueberry.py|com.omarchy.Impala|com.omarchy.Wiremix|com.omarchy.Omarchy|org.gnome.NautilusPreviewer|com.gabm.satty|Omarchy|About|TUI.float|org.gnome.Solanum)

windowrule = workspace 2, class:(zen)
# Float Spotify and place it at your desired location
windowrule = workspace 11, class:(spotify)
windowrulev2 = float, class:^(spotify)$
windowrulev2 = size 1056 601, class:^(spotify)$
windowrulev2 = move 12 1307, class:^(spotify)$
windowrulev2 = workspace 11, class:^(goofcord|discord|com.discordapp.Discord)$
# Float Discord and place it at your desired location
windowrulev2 = float, class:^(goofcord|discord|com.discordapp.Discord)$
windowrulev2 = size 1056 1281, class:^(goofcord|discord|com.discordapp.Discord)$
windowrulev2 = move 12 12, class:^(goofcord|discord|com.discordapp.Discord)$
windowrule = workspace 5, class:(org.qbittorrent.qBittorrent)
windowrule = workspace special:zotero, class:Zotero
windowrule = workspace 4, class:^(steam|heroic|lutris|modrinth-app)$
windowrule = workspace special:notion, class:notion-app-enhanced
windowrulev2 = float,class:Windscribe
windowrulev2 = float,class:file-jpeg
windowrulev2 = opacity 1.0 override,class:com.mitchellh.ghostty
windowrulev2 = workspace 10, class:^(steam_app_.*|cs2|gamescope|Minecraft.*)$
windowrulev2 = workspace 4, title:^(Rockstar Games)$
windowrulev2 = opacity 1.0 override 1.0 override, title:^(.*Netflix.*)$
windowrulev2 = opacity 1.0 override 1.0 override, title:^(.*YouTube.*)$
windowrulev2 = opacity 1.0 override 1.0 override, title:^(.*Twitch.*)$
windowrulev2 = opacity 1.0 override 1.0 override, title:^(.*Disney.*)$
windowrulev2 = opacity 1.0 override 1.0 override, title:^(.*Max.*)$
windowrulev2 = opacity 1.0 override 1.0 override, class:^(.*steam.*)$
windowrulev2 = opacity 1.0 override 1.0 override, class:^(.*Steam.*)$


windowrulev2 = noanim, class:^(steam_app_.*|cs2|gamescope|Minecraft.*)$

windowrulev2 = float, class:^(gamescope)$, title:^(.*Classic Offensive.*)
windowrulev2 = noanim, class:^(gamescope)$, title:^(.*Classic Offensive.*)
windowrulev2 = size 2560 1440, title:^(.*Classic Offensive.*)
windowrulev2 = center, class:^(gamescope)$, title:^(.*Classic Offensive.*)
windowrule = rounding 0, class:^(gamescope)$, title:^(.*Classic Offensive.*)
# windowrulev2 = float, title:^(.*Minecraft.*)
# windowrulev2 = noanim, title:^(.*Minecraft.*)
# windowrulev2 = size 2560 1440, title:^(.*Minecraft.*)
# windowrulev2 = center, title:^(.*Minecraft.*)
# windowrule = rounding 0, title:^(.*Minecraft.*)
windowrulev2 = opacity 1.0 override 1.0 override, title:^(.*Minecraft.*)



windowrulev2 = float, class:^(gamescope)$, title:^(.*Counter-Strike.*)
windowrulev2 = noanim, class:^(gamescope)$, title:^(.*Counter-Strike.*)
windowrulev2 = size 2560 1440, title:^(.*Counter-Strike.*)
windowrulev2 = center, class:^(gamescope)$, title:^(.*Counter-Strike.*)
windowrule = rounding 0, class:^(gamescope)$, title:^(.*Counter-Strike.*)
#
# DAVINCI RESOLVE
windowrulev2 = opacity 1.0 override 1.0 override, class:^(resolve)$
windowrulev2 = workspace 3, class:^(resolve)$

# Workspace 10: zero effects
workspace = 10, bordersize:0
workspace = 10, gapsin:0
workspace = 10, gapsout:0
workspace = 10, rounding:0
workspace = 10, noanim:true
