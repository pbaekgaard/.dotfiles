# Application bindings
$terminal = uwsm-app -- xdg-terminal-exec
$browser = omarchy-launch-browser

bindd = SUPER, RETURN, Terminal, exec, $terminal --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER, E, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER SHIFT ALT, W, Browser (private), exec, $browser --private
bindd = CTRL SHIFT, ESCAPE, Activity, exec, omarchy-launch-tui btop
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
bindd = SUPER SHIFT, SLASH, Passwords, exec, uwsm-app -- 1password
# bindd = SUPER SHIFT, M, Music, exec, omarchy-launch-or-focus spotify
# bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor
# bindd = SUPER SHIFT, G, Signal, exec, omarchy-launch-or-focus signal "uwsm-app -- signal-desktop"
# bindd = SUPER SHIFT, O, Obsidian, exec, omarchy-launch-or-focus "^obsidian$" "uwsm-app -- obsidian -disable-gpu --enable-wayland-ime"
# bindd = SUPER SHIFT, W, Typora, exec, uwsm-app -- typora --enable-wayland-ime

# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
bindd = SUPER SHIFT, A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
# bindd = SUPER SHIFT ALT, A, Grok, exec, omarchy-launch-webapp "https://grok.com"
# bindd = SUPER SHIFT, C, Calendar, exec, omarchy-launch-webapp "https://app.hey.com/calendar/weeks/"
# bindd = SUPER SHIFT, E, Email, exec, omarchy-launch-webapp "https://app.hey.com"
# bindd = SUPER SHIFT, Y, YouTube, exec, omarchy-launch-webapp "https://youtube.com/"
# bindd = SUPER SHIFT ALT, G, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"
# bindd = SUPER SHIFT CTRL, G, Google Messages, exec, omarchy-launch-or-focus-webapp "Google Messages" "https://messages.google.com/web/conversations"
# bindd = SUPER SHIFT, P, Google Photos, exec, omarchy-launch-or-focus-webapp "Google Photos" "https://photos.google.com/"
# bindd = SUPER SHIFT, X, X, exec, omarchy-launch-webapp "https://x.com/"
# bindd = SUPER SHIFT ALT, X, X Post, exec, omarchy-launch-webapp "https://x.com/compose/post"

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu

unbind = SUPER, W
bindd = SUPER, W, Browser, exec, $browser
bindd = SUPER, C, Close window, killactive,


unbind = SUPER, SPACE
bindd = SUPER, D, Launch apps, exec, omarchy-launch-walker # Omarchy Default Launcher
# bindd = SUPER, D, Launch Vicinae, exec, vicinae open # Vicinae

unbind = SUPER, K
bindd = SUPER ALT, slash, Show key bindings, exec, omarchy-menu-keybindings

unbind = SUPER, J
bindd = SUPER, Y, Toggle window split, togglesplit, # dwindle


bindd = SUPER, H, Move window focus left, movefocus, l
bindd = SUPER, J, Move window focus down, movefocus, d
bindd = SUPER, K, Move window focus up, movefocus, u
bindd = SUPER, L, Move window focus right, movefocus, r

bindd = SUPER CTRL, H, Move window left, movewindow, l
bindd = SUPER CTRL, J, Move window down, movewindow, d
bindd = SUPER CTRL, K, Move window up, movewindow, u
bindd = SUPER CTRL, L, Move window right, movewindow, r

bindd = SUPER SHIFT, H, Move window to workspace left, movetoworkspace, -1
bindd = SUPER SHIFT, L, Move window to workspace right, movetoworkspace, +1

unbind = SUPER, ESCAPE
bindd = SUPER, X, System menu, exec, omarchy-menu system
bindd = SUPER, ESCAPE, Lock Screen, exec, omarchy-lock-screen

unbind = SUPER, P
bindd = SUPER, P, Display Settings, exec, nwg-displays


# Normal Workspaces
unbind = SUPER, code:19
bindd = SUPER, 0, Goto Gaming Workspace, workspace, 10
#

# Special Workspaces
unbind = SUPER, S
bindd = SUPER, M, Toggle Music Workspace, togglespecialworkspace, music
bindd = SUPER, N, Toggle Notion Workspace, togglespecialworkspace, notion
bindd = SUPER, S, Toggle Pomodoro Workspace, togglespecialworkspace, pomodoro
bindd = SUPER SHIFT, N, Move to Notion Workspace, movetoworkspace, special:notion
bindd = SUPER, Z, Toggle Zotero Workspace, togglespecialworkspace, zotero


# Color picker
unbind = SUPER SHIFT, P
bindd = SUPER SHIFT, P, Color Picker, exec, /home/pbk/.config/hypr/scripts/colorpicker.sh


# Resize using WIN, ALT + left click
bindmd = SUPER ALT, mouse:272, Resize window, resizewindow


# Change keyboard layout
bindd = SUPER, SPACE, Switch Keyboard Layout, exec, \
for dev in $(hyprctl devices -j | jq -r '.keyboards[] | .name'); do \
    hyprctl switchxkblayout "$dev" next; \
done; \
$osdclient --custom-message="Layout: $(hyprctl devices -j | jq -r '.keyboards[0].active_keymap')" --custom-icon=input-keyboard




# Screenshots
bindd = SUPER SHIFT, S, Screenshot to clipboard, exec, omarchy-cmd-screenshot smart clipboard


# Closing lid
bindl = , switch:off:Lid Switch,exec,hyprctl keyword monitor "eDP-1, 2240x1400, 0x0, 1"
# trigger when the switch is turning on
bindl = , switch:on:Lid Switch,exec,hyprctl keyword monitor "eDP-1, disable"


bind = , code:191, pass, ^discord$
bind = , Scroll_Lock, pass, class:^discord$
bind = , Scroll_Lock, pass, class:^goofcord$

bindld = , code:195, Next track, exec, playerctl --player=spotify previous
bindld = , code:196, Play-Pause spotify, exec, playerctl --player=spotify play-pause
bindld = , code:197, Previous track, exec, playerctl --player=spotify next

bindd = SUPER SHIFT, P, Color Picker, exec, hyprpicker -a

unbind = SUPER CTRL, SPACE
